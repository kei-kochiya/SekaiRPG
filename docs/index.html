<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SekaiRPG – Tài liệu kỹ thuật</title>
<style>
:root{
  --bg:#ffffff;--sidebar:#f8f9fa;--panel:#ffffff;--border:#e2e8f0;
  --acc:#0f766e;--acc2:#4f46e5;--text:#0f172a;--muted:#64748b;
  --fn:#1e293b;--tag:#f1f5f9;--warn:#ea580c;
  font-family:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:var(--sidebar);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:1.1rem;font-weight:700;color:var(--acc);letter-spacing:.04em}
header span{color:var(--muted);font-size:.8rem}
#search{margin-left:auto;background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:6px 12px;border-radius:6px;font-size:.85rem;width:220px;outline:none}
#search:focus{border-color:var(--acc)}
.layout{display:flex;flex:1;overflow:hidden}
aside{width:280px;min-width:220px;background:var(--sidebar);border-right:1px solid var(--border);
  overflow-y:auto;flex-shrink:0;padding:12px 0}
.tree-item{display:flex;align-items:center;gap:6px;padding:4px 12px;
  cursor:pointer;font-size:.82rem;border-radius:0;transition:background .15s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-item:hover{background:rgba(15,118,110,.06)}
.tree-item.active{background:rgba(15,118,110,.12);color:var(--acc)}
.tree-folder{color:var(--acc2);font-weight:600;font-size:.8rem;
  padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  user-select:none;border-radius:0}
.tree-folder:hover{background:rgba(79,70,229,.08)}
.tree-folder .arrow{transition:transform .2s;display:inline-block;font-size:.65rem}
.tree-folder.open .arrow{transform:rotate(90deg)}
.tree-children{display:none;padding-left:14px}
.tree-children.open{display:block}
.icon-folder{color:var(--acc2)}
.icon-file{color:var(--muted);font-size:.75rem}
main{flex:1;overflow-y:auto;padding:32px 40px}
.welcome{text-align:center;padding:80px 20px;color:var(--muted)}
.welcome h2{font-size:1.6rem;color:var(--acc);margin-bottom:8px}
.file-header{margin-bottom:24px}
.file-header h2{font-size:1.4rem;font-weight:700;color:var(--fn);margin-bottom:4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{background:var(--tag);color:var(--acc);padding:2px 10px;border-radius:20px;font-size:.75rem}
.badge.ext{color:var(--acc2)}
.docstring{background:var(--panel);border-left:3px solid var(--acc);
  padding:14px 18px;border-radius:0 8px 8px 0;margin:16px 0;
  font-size:.88rem;line-height:1.7;color:#334155;white-space:pre-wrap;
  border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
h3{font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;margin:28px 0 12px;border-bottom:1px solid var(--border);padding-bottom:6px}
.fn-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.fn-card:hover{border-color:var(--acc)}
.fn-sig{padding:12px 16px;font-family:monospace;font-size:.85rem;
  display:flex;gap:8px;align-items:baseline;cursor:pointer}
.fn-kw{color:var(--acc2)}
.fn-name{color:var(--acc);font-weight:700}
.fn-params{color:#475569}
.fn-doc{padding:8px 16px 14px;font-size:.82rem;color:#475569;
  line-height:1.7;border-top:1px solid var(--border);white-space:pre-wrap;display:none}
.fn-card.open .fn-doc{display:block}
.var-table{width:100%;border-collapse:collapse;font-size:.83rem}
.var-table th{text-align:left;color:var(--muted);font-weight:500;
  padding:6px 12px;border-bottom:1px solid var(--border)}
.var-table td{padding:5px 12px;border-bottom:1px solid var(--border)}
.var-table tr:hover td{background:var(--sidebar)}
.vname{color:var(--acc);font-family:monospace}
.vtype{color:var(--acc2);font-size:.78rem}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>⚔ SekaiRPG</h1>
  <span>Tài liệu kỹ thuật – tự động sinh từ GDScript</span>
  <input id="search" type="search" placeholder="Tìm file...">
</header>
<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="welcome">
      <h2>⚔ SekaiRPG Docs</h2>
      <p>Chọn file ở cây thư mục bên trái để xem tài liệu</p>
    </div>
  </main>
</div>

{"name": "p_count", "type": ""}, {"name": "p", "type": ""}, {"name": "mean_lv", "type": ""}, {"name": "target_lv", "type": ""}, {"name": "enemies", "type": ""}, {"name": "pool", "type": ""}, {"name": "candidates", "type": ""}, {"name": "e_name", "type": ""}, {"name": "enemy_class", "type": ""}, {"name": "enemy", "type": ""}, {"name": "min_hp", "type": ""}, {"name": "mizuki", "type": ""}, {"name": "mafuyu", "type": ""}, {"name": "mizuki", "type": ""}, {"name": "ena", "type": ""}, {"name": "ena", "type": ""}, {"name": "enemies", "type": ""}, {"name": "p_team", "type": ""}, {"name": "boss", "type": ""}, {"name": "p_team", "type": ""}, {"name": "enemies", "type": ""}, {"name": "p_team", "type": ""}, {"name": "enemies", "type": ""}, {"name": "p_team", "type": ""}, {"name": "enemies", "type": ""}]}, {"path": "Scripts/Battle/BattleScenario.gd", "name": "BattleScenario.gd", "extends": "Node", "class_name": "BattleScenario", "docstring": "Tóm tắt: BattleScenario là lớp cơ sở (Base Class) cho các kịch bản trận đấu đặc biệt.\n\nChức năng chính:\n- Định nghĩa các phương thức ảo (Virtual Methods) như `on_start`, `on_turn_start`, `on_turn_end`, `on_entity_died`.\n- Cung cấp điểm nối (hooks) để các kịch bản cốt truyện có thể ghi đè và thực thi logic tùy chỉnh mà không cần sửa đổi Engine trận đấu.", "functions": [{"name": "on_start", "params": "_main: Node", "doc": "Gọi khi trận đấu bắt đầu."}, {"name": "on_turn_start", "params": "_main: Node, _actor: Entity", "doc": "Gọi khi một thực thể bắt đầu lượt."}, {"name": "on_turn_end", "params": "_main: Node, _actor: Entity", "doc": "Gọi khi một thực thể kết thúc lượt."}, {"name": "on_entity_died", "params": "_main: Node, _entity: Entity", "doc": "Gọi khi có bất kỳ thực thể nào tử trận."}, {"name": "check_battle_end", "params": "_main: Node", "doc": "Kiểm tra điều kiện kết thúc trận đấu.\n\tTrả về true nếu kịch bản đã xử lý việc kết thúc trận đấu."}, {"name": "get_victory_status", "params": "_main: Node", "doc": "Xác định kết quả thắng hay thua."}, {"name": "on_battle_completed", "params": "_main: Node, _is_victory: bool", "doc": "Gọi sau khi trận đấu đã được xác định kết quả."}], "variables": []}, {"path": "Scripts/Battle/BattleTutorial.gd", "name": "BattleTutorial.gd", "extends": "Node", "class_name": "BattleTutorial", "docstring": "Tóm tắt: BattleTutorial quản lý giao diện hướng dẫn chiến đấu theo từng bước.\n\nChức năng chính:\n- Hiển thị bảng giải thích cơ chế chiến đấu (Turn-based, Action Gauge, Kỹ năng) cho người chơi.\n- Khóa cờ `is_tutorial` trong GameManager để đảm bảo hướng dẫn chỉ hiện một lần duy nhất.\n- Tự động xây dựng UI tùy chỉnh hỗ trợ BBCode và đọc Asset từ thư viện Kenney.", "functions": [], "variables": [{"name": "panel", "type": ""}, {"name": "vbox", "type": "VBoxContainer"}, {"name": "steps", "type": ""}, {"name": "t_lbl", "type": ""}, {"name": "c_lbl", "type": ""}, {"name": "btn", "type": ""}, {"name": "bns", "type": ""}, {"name": "canvas", "type": ""}, {"name": "panel", "type": ""}, {"name": "bg", "type": ""}, {"name": "sb", "type": ""}, {"name": "vbox", "type": ""}]}, {"path": "Scripts/Battle/CooldownManager.gd", "name": "CooldownManager.gd", "extends": "Node", "class_name": "CooldownManager", "docstring": "Tóm tắt: CooldownManager quản lý thời gian hồi chiêu (cooldown) của kỹ năng.\n\nChức năng chính:\n- Cung cấp các phương thức tĩnh để đếm ngược cooldown mỗi lượt (`process_cooldowns`).\n- Kiểm tra trạng thái sẵn sàng của kỹ năng (`is_skill_ready`).\n- Thiết lập thời gian chờ sau khi thực thể sử dụng kỹ năng (`set_cooldown`).", "functions": [], "variables": [{"name": "keys", "type": ""}]}, {"path": "Scripts/Battle/DamageCalculator.gd", "name": "DamageCalculator.gd", "extends": "Node", "class_name": "DamageCalculator", "docstring": "Tóm tắt: DamageCalculator phụ trách tính toán lượng sát thương cuối cùng trong trận đấu.\n\nChức năng chính:\n- Cung cấp phương thức tĩnh `calculate_damage` để xử lý công thức sát thương: raw_dmg = (ATK * Multiplier) - DEF.\n- Tự động áp dụng hệ số giảm trừ theo kháng (RES) và tương khắc thuộc tính (thông qua TypeChart).\n- Đảm bảo sát thương tối thiểu gây ra không bao giờ thấp hơn 5% ATK của người tấn công.", "functions": [], "variables": [{"name": "modified_atk", "type": ""}, {"name": "raw_damage", "type": ""}, {"name": "after_res", "type": ""}, {"name": "multiplier", "type": ""}, {"name": "final_damage", "type": ""}, {"name": "min_damage", "type": ""}]}, {"path": "Scripts/Battle/ProcessStatus.gd", "name": "ProcessStatus.gd", "extends": "Node", "class_name": "ProcessStatus", "docstring": "Tóm tắt: ProcessStatus xử lý các hiệu ứng trạng thái (Status Effects) cho thực thể.\n\nChức năng chính:\n- Quản lý logic gây sát thương theo thời gian (DoT) như Poison, Bleed.\n- Xử lý trạng thái khống chế (Stun) và cập nhật thời hạn (duration) của các hiệu ứng đang có trên thực thể vào đầu mỗi lượt (`handle_turn_start`).\n- Tự động xóa các hiệu ứng đã hết thời hạn.", "functions": [], "variables": [{"name": "can_act", "type": ""}, {"name": "statuses_to_remove", "type": ""}, {"name": "bleed_count", "type": ""}, {"name": "bleed_dmg", "type": ""}, {"name": "pct", "type": ""}, {"name": "dmg", "type": ""}]}, {"path": "Scripts/Battle/TurnCalculator.gd", "name": "TurnCalculator.gd", "extends": "Node", "class_name": "TurnCalculator", "docstring": "Tóm tắt: TurnCalculator tính toán thứ tự hành động (Turn Order) dựa trên Action Value (AV).\n\nChức năng chính:\n- Quy đổi chỉ số tốc độ (SPD) thành Action Value (`get_action_value`).\n- Dự báo danh sách lượt đi trong tương lai (`get_timeline`) với cơ chế tie-breaker để giải quyết các trường hợp trùng AV.\n- Lọc bỏ lượt của các thực thể đã bị hạ gục khỏi dòng thời gian (`remove_dead_from_timeline`).", "functions": [], "variables": [{"name": "BASE_VALUE", "type": ""}, {"name": "timeline", "type": ""}, {"name": "spd", "type": ""}, {"name": "current_gauge", "type": ""}, {"name": "distance", "type": ""}, {"name": "av_cost", "type": ""}, {"name": "updated_timeline", "type": ""}]}, {"path": "Scripts/Battle/TypeChart.gd", "name": "TypeChart.gd", "extends": "Node", "class_name": "TypeChart", "docstring": "Tóm tắt: TypeChart quản lý bảng tương khắc thuộc tính giữa các hệ trong game.\n\nChức năng chính:\n- Định nghĩa ma trận tương khắc cho 5 hệ: Cool, Happy, Cute, Mysterious, Pure.\n- Cung cấp phương thức tĩnh `get_multiplier` để trả về hệ số nhân: x1.25 (Mạnh hơn), x0.8 (Yếu hơn) hoặc x1.0 (Bình thường).", "functions": [], "variables": [{"name": "data", "type": ""}]}, {"path": "Scripts/Core/GameManager.gd", "name": "GameManager.gd", "extends": "Node", "class_name": "", "docstring": "Tóm tắt: GameManager là bộ não trung tâm (Autoload) quản lý toàn bộ vòng đời của trò chơi.\n\nChức năng chính:\n- Lưu trữ và cung cấp đối tượng đội hình (Party).\n- Quản lý bộ đệm trạng thái cốt truyện thông qua StoryState (cờ sự kiện, tiến độ map).\n- Xử lý hệ thống lưu và tải game (Save/Load) qua JSON.\n- Điều phối các chế độ chơi đặc biệt: Sandbox, Training, Scripted Battle.\n- Xử lý luồng sau khi trận chiến kết thúc (tính exp, kích hoạt sự kiện, chuyển cảnh).\n- Quản lý tùy chọn cài đặt hệ thống (Volume, Battle Speed, Skip Battle).", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "_init_party", "params": "", "doc": "Khởi tạo các đối tượng nhân vật chính và cấp độ ban đầu cho đội hình.\n\t\n\tArgs: Không có\n\tReturns: Không có"}, {"name": "set_flag", "params": "id: String, value: Variant", "doc": ""}, {"name": "get_flag", "params": "id: String, default: Variant = false", "doc": ""}, {"name": "get_party_member", "params": "m_name: String", "doc": ""}, {"name": "start_dialogue", "params": "", "doc": ""}, {"name": "end_dialogue", "params": "", "doc": ""}, {"name": "save_game", "params": "path: String = SAVE_PATH", "doc": "Thực hiện lưu toàn bộ dữ liệu game vào một file cụ thể.\n\t\n\tArgs:\n\t\tpath (String): Đường dẫn file lưu. Mặc định là SAVE_PATH.\n\tReturns: Không có"}, {"name": "get_current_save_path", "params": "", "doc": ""}, {"name": "load_game", "params": "path: String = SAVE_PATH", "doc": "Nạp dữ liệu từ một file save cụ thể và phục hồi trạng thái game.\n\t\n\tArgs:\n\t\tpath (String): Đường dẫn file nạp. Mặc định là SAVE_PATH.\n\tReturns: \n\t\tbool: True nếu nạp thành công, False nếu thất bại."}, {"name": "has_save", "params": "path: String = SAVE_PATH", "doc": ""}, {"name": "get_save_files", "params": "", "doc": "Lấy danh sách tất cả các file save (.json) có trong thư mục user://.\n\t\n\tArgs: Không có\n\tReturns:\n\t\tArray: Mảng chứa đường dẫn các file save."}, {"name": "reset_game", "params": "", "doc": ""}, {"name": "store_map_state", "params": "map_path: String, player_pos: Vector2", "doc": ""}, {"name": "reset_mission_stats", "params": "", "doc": ""}, {"name": "trigger_battle", "params": "", "doc": ""}, {"name": "finish_battle", "params": "victory: bool, count: int = 1", "doc": "Xử lý logic kết quả sau trận đấu (Exp, Cốt truyện, Chuyển cảnh).\n\t\n\tArgs:\n\t\tvictory (bool): Cờ báo thắng hay thua.\n\t\tcount (int): Số lượng địch bị hạ.\n\tReturns: Không có"}], "variables": [{"name": "story", "type": "StoryState"}, {"name": "current_map_file", "type": "String"}, {"name": "last_player_position", "type": "Vector2"}, {"name": "is_training_mode", "type": "bool"}, {"name": "training_participants", "type": "Array"}, {"name": "training_used_opponents", "type": "Array"}, {"name": "last_battle_max_lv", "type": "int"}, {"name": "is_in_dialogue", "type": "bool"}, {"name": "is_tutorial", "type": "bool"}, {"name": "is_sandbox", "type": "bool"}, {"name": "is_scripted_battle", "type": "bool"}, {"name": "scripted_battle_id", "type": "String"}, {"name": "sandbox_player_team", "type": "Array"}, {"name": "sandbox_enemy_team", "type": "Array"}, {"name": "battle_speed", "type": "float"}, {"name": "master_volume", "type": "float"}, {"name": "skip_battle_unlocked", "type": "bool"}, {"name": "skip_battle_enabled", "type": "bool"}, {"name": "party", "type": "Dictionary"}, {"name": "flags", "type": "Dictionary"}, {"name": "warehouse_wave", "type": "int"}, {"name": "harbor_wave", "type": "int"}, {"name": "enemies_defeated", "type": "int"}, {"name": "harbor_guards_defeated", "type": "int"}, {"name": "harbor_route", "type": "String"}, {"name": "prologue_phase", "type": "int"}, {"name": "harbor_mission_done", "type": "bool"}, {"name": "harbor_mission_unlocked", "type": "bool"}, {"name": "intro_quest_done", "type": "bool"}, {"name": "safehouse_intro_done", "type": "bool"}, {"name": "npcs_greeted", "type": "Array"}, {"name": "warehouse_mission_accepted", "type": "bool"}, {"name": "talked_to_mafuyu_training", "type": "bool"}, {"name": "accepted_harbor_mission", "type": "bool"}, {"name": "harbor_intro_done", "type": "bool"}, {"name": "upgrade_tutorial_done", "type": "bool"}, {"name": "guards_defeated", "type": "bool"}, {"name": "training_ichika_done", "type": "bool"}, {"name": "training_kanade_done", "type": "bool"}, {"name": "harbor_meeting_p1_done", "type": "bool"}, {"name": "mafuyu_honami_talked", "type": "bool"}, {"name": "mizuki_control_phase", "type": "bool"}, {"name": "harbor_mizuki_snack_done", "type": "bool"}, {"name": "SAVE_PATH", "type": ""}, {"name": "save_data", "type": ""}, {"name": "e", "type": ""}, {"name": "f", "type": ""}, {"name": "map_name", "type": ""}, {"name": "f", "type": ""}, {"name": "data", "type": ""}, {"name": "pos", "type": ""}, {"name": "m_state", "type": ""}, {"name": "p_data", "type": ""}, {"name": "e", "type": ""}, {"name": "saves", "type": ""}, {"name": "dir", "type": ""}, {"name": "file_name", "type": ""}, {"name": "bonus_exp", "type": ""}, {"name": "entity", "type": ""}]}, {"path": "Scripts/Core/StoryState.gd", "name": "StoryState.gd", "extends": "Node", "class_name": "StoryState", "docstring": "Tóm tắt: StoryState là vùng nhớ chuyên dụng lưu trữ toàn bộ tiến trình và sự kiện cốt truyện.\n\nChức năng chính:\n- Lưu trữ bộ từ điển `flags` chứa các biến boolean/int để theo dõi trạng thái nhiệm vụ, đối thoại và mở khóa.\n- Lưu trữ biến đếm (wave, kẻ địch tiêu diệt) cho các nhiệm vụ cày cuốc (Warehouse, Harbor).\n- Cung cấp API để `GameManager` dễ dàng thiết lập (set), đọc (get) và khôi phục (reset) trạng thái.\n- Hỗ trợ Serialize/Deserialize dữ liệu sang JSON để phục vụ việc Save/Load Game.", "functions": [{"name": "set_flag", "params": "id: String, value: Variant", "doc": ""}, {"name": "get_flag", "params": "id: String, default: Variant = false", "doc": ""}, {"name": "reset", "params": "", "doc": "Khôi phục toàn bộ tiến trình và dữ liệu nhiệm vụ về trạng thái mặc định.\n\t\n\tArgs: Không có\n\tReturns: Không có"}, {"name": "serialize", "params": "", "doc": "Chuyển đổi toàn bộ dữ liệu trạng thái sang định dạng Dictionary.\n\t\n\tArgs: Không có\n\tReturns:\n\t\tDictionary: Chứa dữ liệu toàn bộ state để lưu."}, {"name": "deserialize", "params": "data: Dictionary", "doc": "Khôi phục trạng thái từ dữ liệu đã được nạp (deserialize).\n\t\n\tArgs:\n\t\tdata (Dictionary): Dữ liệu trạng thái đã lưu.\n\tReturns: Không có"}], "variables": [{"name": "flags", "type": "Dictionary"}, {"name": "warehouse_wave", "type": "int"}, {"name": "harbor_wave", "type": "int"}, {"name": "enemies_defeated", "type": "int"}, {"name": "harbor_guards_defeated", "type": "int"}, {"name": "harbor_route", "type": "String"}]}, {"path": "Scripts/Overworld/InteractableZone.gd", "name": "InteractableZone.gd", "extends": "Area2D", "class_name": "InteractableZone", "docstring": "Tóm tắt: InteractableZone quản lý các vùng tương tác sự kiện trên bản đồ.\n\nChức năng chính:\n- Tạo một vùng phát hiện va chạm (Area2D) chuyên biệt để nhận diện OverworldPlayer.\n- Tự động hiển thị nhãn gợi ý (Prompt) \"Press ENTER\" khi người chơi nằm trong vùng an toàn.\n- Lắng nghe sự kiện phím (InputEvent) và phát tín hiệu `interacted` khi người chơi bấm nút tương tác.\n- Tích hợp với hệ thống MobileControls để hiển thị phím bấm tương tác ảo trên điện thoại.", "functions": [{"name": "_ready", "params": "", "doc": "Khởi tạo cấu hình cho vùng tương tác và nhãn gợi ý hiển thị.\n\t\n\tThiết lập Collision Layer để không cản trở và Collision Mask để phát hiện \n\tngười chơi (Layer 1). Tạo nhãn gợi ý sử dụng StyleBox từ bộ Assets Kenney."}, {"name": "_on_body_entered", "params": "body", "doc": "Xử lý khi người chơi bước vào vùng tương tác.\n\n\tArgs:\n\t\tbody (Node2D): Đối tượng vừa bước vào vùng."}, {"name": "_on_body_exited", "params": "body", "doc": "Xử lý khi người chơi bước ra khỏi vùng tương tác.\n\n\tArgs:\n\t\tbody (Node2D): Đối tượng vừa bước ra khỏi vùng."}, {"name": "_unhandled_input", "params": "event: InputEvent", "doc": "Xử lý hành động nhấn phím tương tác từ người chơi.\n\n\tĐảm bảo tương tác chỉ xảy ra khi người chơi đang ở trong vùng và không \n\tđang trong trạng thái hội thoại. Sử dụng set_input_as_handled để ngăn \n\tchặn sự kiện phím lan truyền sang các đối tượng khác.\n\n\tArgs:\n\t\tevent (InputEvent): Sự kiện đầu vào từ bàn phím."}, {"name": "_process", "params": "_delta", "doc": "Cập nhật trạng thái hiển thị của nhãn gợi ý theo thời gian thực."}], "variables": [{"name": "prompt_label", "type": "Label"}, {"name": "is_player_inside", "type": "bool"}, {"name": "prompt_text", "type": "String"}, {"name": "pb", "type": ""}]}, {"path": "Scripts/Overworld/OverworldPlayer.gd", "name": "OverworldPlayer.gd", "extends": "CharacterBody2D", "class_name": "OverworldPlayer", "docstring": "Tóm tắt: OverworldPlayer điều khiển nhân vật người chơi trong thế giới khám phá (Overworld).\n\nChức năng chính:\n- Khởi tạo hitbox vật lý, camera và hình ảnh đại diện (Marker) cho người chơi.\n- Xử lý hệ thống di chuyển đa hướng (8 hướng) bằng cả bàn phím (WASD/Mũi tên) và tay cầm/joystick.\n- Tự động tìm kiếm và xoay mũi tên hướng dẫn (Objective Arrow) về phía mục tiêu nhiệm vụ gần nhất.\n- Hỗ trợ khóa di chuyển khi đang trong trạng thái hội thoại.", "functions": [{"name": "_ready", "params": "", "doc": "Khởi tạo các thành phần cốt lõi của người chơi.\n\t\n\tThiết lập va chạm, Marker đại diện, mũi tên chỉ đường, Hitbox vật lý \n\tvà Camera theo chân. Tự động khôi phục vị trí từ GameManager nếu có."}, {"name": "_process", "params": "_delta", "doc": "Cập nhật logic hình ảnh không liên quan đến vật lý (Mũi tên mục tiêu)."}, {"name": "_update_objective_arrow", "params": "", "doc": "Xác định và chỉ hướng tới mục tiêu nhiệm vụ gần nhất.\n\t\n\tQuét các Node trong nhóm 'objectives', tính toán khoảng cách và xoay \n\tmũi tên hướng về phía đối tượng gần nhất."}, {"name": "_physics_process", "params": "_delta", "doc": "Xử lý di chuyển vật lý và điều khiển đầu vào từ người chơi.\n\n\tNếu đang trong trạng thái hội thoại, vận tốc sẽ được đặt về 0. \n\tMarker của người chơi sẽ tự động chuyển đổi giữa hình tròn (đứng yên) \n\tvà hình mũi tên (di chuyển) dựa trên vector vận tốc."}, {"name": "_draw_dot", "params": "", "doc": "Vẽ hình tròn đơn giản đại diện cho trạng thái đứng yên của người chơi."}, {"name": "_draw_arrow", "params": "dir: Vector2", "doc": "Vẽ hình mũi tên đa giác chỉ hướng di chuyển hiện tại.\n\n\tArgs:\n\t\tdir (Vector2): Vector hướng di chuyển của nhân vật."}], "variables": [{"name": "SPEED", "type": ""}, {"name": "character_color", "type": "Color"}, {"name": "_marker", "type": "Polygon2D"}, {"name": "_objective_arrow", "type": "Sprite2D"}, {"name": "_last_dir", "type": "Vector2"}, {"name": "arrow_tex", "type": ""}, {"name": "shape", "type": ""}, {"name": "rect", "type": ""}, {"name": "camera", "type": ""}, {"name": "objectives", "type": ""}, {"name": "closest", "type": "Node2D"}, {"name": "min_dist", "type": ""}, {"name": "d", "type": ""}, {"name": "dir", "type": ""}, {"name": "input_dir", "type": ""}, {"name": "points", "type": ""}, {"name": "r", "type": ""}, {"name": "sides", "type": ""}, {"name": "angle", "type": ""}, {"name": "norm", "type": ""}, {"name": "perp", "type": ""}, {"name": "tip", "type": ""}, {"name": "base_left", "type": ""}, {"name": "base_right", "type": ""}]}, {"path": "Scripts/Systems/AudioManager.gd", "name": "AudioManager.gd", "extends": "Node", "class_name": "", "docstring": "Tóm tắt: AudioManager là Node Autoload chịu trách nhiệm quản lý phát nhạc nền toàn cục.\n\nChức năng chính:\n- Duy trì việc phát nhạc nền (BGM) xuyên suốt các cảnh chơi mà không bị ngắt quãng.\n- Cung cấp tính năng chuyển đổi bài nhạc mượt mà thông qua hiệu ứng Fade In/Fade Out (Tween âm lượng).\n- Lưu trữ danh sách đường dẫn các bài nhạc thường dùng qua hằng số `TRACKS`.\n- Cung cấp API `update_volume` cho phép tùy chỉnh âm lượng tổng (Master Bus) thông qua Settings.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "play_music", "params": "track_name: String, fade_duration: float = 1.0", "doc": "Phát một bài nhạc nền có sẵn trong thư mục Music.\n\t\n\tArgs:\n\t\ttrack_name (String): Tên định danh của bài nhạc.\n\t\tfade_duration (float): Thời gian làm mờ khi chuyển bài (giây).\n\tReturns: Không có"}, {"name": "stop_music", "params": "fade_duration: float = 1.0", "doc": "Dừng phát nhạc nền hiện tại kèm hiệu ứng giảm âm dần.\n\t\n\tArgs:\n\t\tfade_duration (float): Thời gian làm mờ (giây) trước khi tắt hẳn.\n\tReturns: Không có"}, {"name": "update_volume", "params": "value: float", "doc": ""}], "variables": [{"name": "_player", "type": "AudioStreamPlayer"}, {"name": "_current_track", "type": "String"}, {"name": "MUSIC_DIR", "type": ""}, {"name": "TRACKS", "type": ""}, {"name": "new_stream", "type": ""}, {"name": "tween", "type": ""}, {"name": "tween", "type": ""}, {"name": "tween", "type": ""}, {"name": "bus_index", "type": ""}, {"name": "db", "type": ""}]}, {"path": "Scripts/Systems/DialogueLoader.gd", "name": "DialogueLoader.gd", "extends": "Node", "class_name": "", "docstring": "Tóm tắt: DialogueLoader là Node hệ thống có nhiệm vụ nạp và xử lý toàn bộ dữ liệu hội thoại từ các file JSON.\n\nChức năng chính:\n- Tự động quét toàn bộ thư mục `res://Data/storyline/` lúc khởi động game.\n- Phân tích cú pháp (parse) và chuyển đổi các file JSON thành một Dictionary `_data` tập trung trên bộ nhớ.\n- Cung cấp API `get_lines(key)` để trích xuất và chuẩn hóa dữ liệu dòng thoại (xác định loại thoại, người nói, màu sắc, vị trí chân dung) cho `DialogueManager` sử dụng.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "_load_json", "params": "", "doc": "Quét thư mục chứa hội thoại và tải tuần tự từng tệp JSON tìm thấy.\n\t\n\tArgs: Không có\n\tReturns: Không có"}, {"name": "_load_single_file", "params": "file_path: String", "doc": "Tải một tệp JSON đơn lẻ và gộp nội dung vào bộ nhớ đệm dùng chung.\n\t\n\tArgs:\n\t\tfile_path (String): Đường dẫn tuyệt đối đến tệp JSON cần nạp.\n\tReturns: Không có"}, {"name": "get_lines", "params": "key: String", "doc": "Lấy và chuẩn hóa danh sách các dòng thoại tương ứng với một khóa (key) chỉ định.\n\t\n\tArgs:\n\t\tkey (String): Khóa định danh hội thoại trong file JSON.\n\tReturns:\n\t\tArray: Mảng các dòng thoại đã chuẩn hóa (chứa type, text, name, speaker, color). Trả về mảng trống nếu không tìm thấy."}], "variables": [{"name": "_data", "type": "Dictionary"}, {"name": "path", "type": ""}, {"name": "dir", "type": ""}, {"name": "file_name", "type": ""}, {"name": "f", "type": ""}, {"name": "text", "type": ""}, {"name": "parsed", "type": "Variant"}, {"name": "new_data", "type": "Dictionary"}, {"name": "raw", "type": "Array"}, {"name": "out", "type": "Array"}, {"name": "line", "type": "Dictionary"}, {"name": "hex", "type": "String"}]}, {"path": "Scripts/Systems/LevelManager.gd", "name": "LevelManager.gd", "extends": "Node", "class_name": "LevelManager", "docstring": "Tóm tắt: LevelManager là lớp tĩnh (Static Class) chuyên trách tính toán kinh nghiệm và thăng cấp nhân vật.\n\nChức năng chính:\n- Xử lý việc cấp và cộng dồn điểm kinh nghiệm (EXP) thông qua hàm `gain_exp()`.\n- Tự động tính toán số cấp thăng lên nếu điểm EXP vượt mức, xử lý chuỗi lên cấp liên tục.\n- Cung cấp thuật toán gia tăng chỉ số gốc dựa trên tỷ lệ % (Growth Rate) và áp dụng cơ chế Soft Cap/Hard Cap.\n- Tự động phân bổ Điểm Kỹ Năng (SP) ngẫu nhiên cho hệ thống quái vật để tạo độ khó biến thiên.", "functions": [], "variables": [{"name": "SOFT_CAP_LEVEL", "type": ""}, {"name": "MAX_LEVEL", "type": ""}, {"name": "growth_rate", "type": ""}, {"name": "spd_growth", "type": ""}, {"name": "exp_curve", "type": ""}, {"name": "levels_to_gain", "type": ""}, {"name": "stats", "type": ""}, {"name": "attempts", "type": ""}, {"name": "stat", "type": ""}]}, {"path": "Scripts/Systems/UpgradeManager.gd", "name": "UpgradeManager.gd", "extends": "Node", "class_name": "UpgradeManager", "docstring": "Tóm tắt: UpgradeManager là lớp tĩnh (Static Class) phụ trách logic sử dụng Điểm Kỹ Năng (SP) để nâng cấp chỉ số.\n\nChức năng chính:\n- Xác định chi phí SP và hệ số gia tăng cơ bản cho mỗi loại chỉ số (HP, ATK, DEF, SPD).\n- Cung cấp API `upgrade_stat` để kiểm tra điều kiện (đủ SP, chưa đạt giới hạn Max Cap) và thực hiện cộng chỉ số.\n- Cung cấp API `bulk_upgrade` giúp thực hiện nâng cấp hàng loạt hoặc nâng tối đa chỉ số chỉ trong một lần bấm để tăng tính tiện dụng cho UI.", "functions": [], "variables": [{"name": "UPGRADE_COST", "type": ""}, {"name": "UPGRADE_AMOUNTS", "type": ""}, {"name": "current_val", "type": ""}, {"name": "cap_val", "type": ""}, {"name": "increment", "type": ""}, {"name": "actual_increment", "type": ""}, {"name": "upgrades_done", "type": ""}]}, {"path": "UI/Battle/ActionGauge.gd", "name": "ActionGauge.gd", "extends": "VBoxContainer", "class_name": "ActionGauge", "docstring": "Tóm tắt: ActionGauge hiển thị danh sách thứ tự hành động (Timeline) trong trận đấu.\n\nChức năng chính:\n- Trực quan hóa danh sách các lượt đánh sắp tới (tối đa 10 lượt).\n- Sử dụng màu sắc để phân biệt giữa phe người chơi (Xanh) và phe địch (Đỏ).\n- Cập nhật linh hoạt thông qua hàm `refresh` mỗi khi có thay đổi trong timeline.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "set_player_team", "params": "team: Array", "doc": "Thiết lập danh sách thực thể phe người chơi để phục vụ việc tô màu.\n\n\tArgs:\n\t\tteam (Array): Mảng các thực thể Entity thuộc phe ta."}, {"name": "refresh", "params": "timeline: Array, current_actor: Entity = null", "doc": "Cập nhật và vẽ lại toàn bộ danh sách thứ tự lượt.\n\n\tArgs:\n\t\ttimeline (Array): Mảng các Dictionary chứa thông tin lượt (entity, tick).\n\t\tcurrent_actor (Entity): Thực thể đang thực hiện lượt hiện tại."}], "variables": [{"name": "PLAYER_COLOR", "type": ""}, {"name": "ENEMY_COLOR", "type": ""}, {"name": "player_team", "type": "Array"}, {"name": "header", "type": ""}, {"name": "sep", "type": ""}, {"name": "display_list", "type": ""}, {"name": "data", "type": ""}, {"name": "entity", "type": ""}, {"name": "is_current", "type": ""}, {"name": "entry_name", "type": ""}, {"name": "is_player", "type": ""}, {"name": "row", "type": ""}, {"name": "num", "type": ""}, {"name": "icon", "type": ""}, {"name": "lbl", "type": ""}]}, {"path": "UI/Battle/BattleHUD.gd", "name": "BattleHUD.gd", "extends": "CanvasLayer", "class_name": "", "docstring": "Tóm tắt: BattleHUD là lớp điều phối giao diện chính trong trận chiến.\n\nChức năng chính:\n- Quản lý việc xây dựng và cập nhật các thành phần UI cốt lõi như: Thanh hành động (Action Gauge), Thẻ nhân vật (Character Cards) và Menu lệnh (Command Menu).\n- Cung cấp các hàm hiển thị thông báo trận đấu: Đến lượt (Turn Indicator), Chiến thắng (Victory), Thất bại (Defeat).\n- Kết nối các nút chức năng phụ như 'Bỏ qua trận đấu' (Skip) và 'Chi tiết chỉ số' (Info).", "functions": [{"name": "setup", "params": "players: Array, enemies: Array", "doc": "Khởi tạo dữ liệu và xây dựng toàn bộ cây Node giao diện.\n\n\t- players: Danh sách các thực thể phe người chơi (Array).\n\t- enemies: Danh sách các thực thể phe đối phương (Array)."}, {"name": "_build_ui", "params": "", "doc": "Xây dựng cấu trúc giao diện theo bố cục định sẵn.\n\t\n\tBố cục bao gồm: Gauge ở góc trên, thẻ nhân vật hai bên cánh, \n\tvà Menu lệnh được căn giữa phía dưới."}, {"name": "_on_info_pressed", "params": "", "doc": "Mở bảng thông số chi tiết của toàn bộ thực thể trên sân."}, {"name": "show_turn_indicator", "par ies (Array): Danh sách kẻ địch trên sân."}, {"name": "cancel", "params": "", "doc": "Đóng menu và phát tín hiệu hủy lệnh để tránh treo game khi skip."}, {"name": "_on_action_picked", "params": "action_name: String", "doc": "Xử lý sự kiện khi người chơi chọn một hành động cụ thể."}, {"name": "_show_targets", "params": "target_type: String = \"enemy\"", "doc": "Hiển thị danh sách các mục tiêu hợp lệ để người chơi lựa chọn."}, {"name": "_on_target_picked", "params": "target: Entity", "doc": "Xác nhận mục tiêu cuối cùng và phát tín hiệu hoàn thành lệnh."}, {"name": "_make_btn", "params": "label: String, action_name: String, enabled: bool", "doc": "Khởi tạo một nút bấm trong menu với phong cách Kenney."}, {"name": "_clear", "params": "container: Container", "doc": "Xóa sạch các Node con trong một Container chỉ định."}], "variables": [{"name": "current_entity", "type": "Entity"}, {"name": "enemy_team", "type": "Array"}, {"name": "chosen_action", "type": "String"}, {"name": "SkillDetailPopupClass", "type": ""}, {"name": "action_container", "type": "VBoxContainer"}, {"name": "target_container", "type": "VBoxContainer"}, {"name": "title_label", "type": "Label"}, {"name": "_skill_detail_popup", "type": "Node"}, {"name": "ps", "type": ""}, {"name": "root", "type": ""}, {"name": "title_row", "type": ""}, {"name": "info_btn", "type": ""}, {"name": "skill_ready", "type": ""}, {"name": "cd", "type": ""}, {"name": "label", "type": ""}, {"name": "btn", "type": ""}, {"name": "target_type", "type": ""}, {"name": "header", "type": ""}, {"name": "team", "type": ""}, {"name": "alive", "type": ""}, {"name": "label", "type": ""}, {"name": "btn", "type": ""}, {"name": "btn", "type": ""}, {"name": "ns", "type": ""}, {"name": "hs", "type": ""}, {"name": "ds", "type": ""}]}, {"path": "UI/Battle/FloatingText.gd", "name": "FloatingText.gd", "extends": "Label", "class_name": "FloatingText", "docstring": "Tóm tắt: FloatingText hiển thị các con số nổi (sát thương, hồi máu) bay lên trên màn hình.\n\nChức năng chính:\n- Tự động thực hiện hiệu ứng bay lên và mờ dần (Tween).\n- Quy định màu sắc dựa trên loại sát thương (Physical: Đỏ, Pure: Trắng, DoT: Tím, Heal: Xanh lá).\n- Cung cấp hàm tĩnh `spawn` để dễ dàng khởi tạo tại bất kỳ vị trí nào trên màn hình.", "functions": [{"name": "_ready", "params": "", "doc": "Khởi tạo hiệu ứng hoạt ảnh bay (Tween) ngay khi node được thêm vào scene."}], "variables": [{"name": "COLORS", "type": ""}, {"name": "float_color", "type": "Color"}, {"name": "tween", "type": ""}, {"name": "ft", "type": ""}, {"name": "prefix", "type": ""}]}, {"path": "UI/Effects/ScreenFade.gd", "name": "ScreenFade.gd", "extends": "CanvasLayer", "class_name": "", "docstring": "Tóm tắt: ScreenFade là Node Autoload quản lý hiệu ứng làm tối/sáng màn hình (Fade In/Out).\n\nChức năng chính:\n- Hiển thị một lớp phủ `ColorRect` màu đen trên cùng của hệ thống UI (Layer 200).\n- Cung cấp API `fade_in` và `fade_out` nhận tham số `duration` để tùy chỉnh tốc độ chuyển cảnh.\n- Trả về tín hiệu `await tw.finished` cho phép các đoạn code gọi nó có thể tạm dừng (yield) chờ hiệu ứng hoàn tất.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "fade_out", "params": "duration: float = 0.5", "doc": "Làm tối màn hình dần dần bằng cách tăng độ đục (alpha) của lớp phủ.\n\t\n\tArgs:\n\t\tduration (float): Thời gian diễn ra hiệu ứng (giây).\n\tReturns: Không có"}, {"name": "fade_in", "params": "duration: float = 0.5", "doc": "Làm sáng màn hình dần dần bằng cách giảm độ đục (alpha) của lớp phủ.\n\t\n\tArgs:\n\t\tduration (float): Thời gian diễn ra hiệu ứng (giây).\n\tReturns: Không có"}], "variables": [{"name": "_rect", "type": "ColorRect"}, {"name": "tw", "type": ""}, {"name": "tw", "type": ""}]}, {"path": "UI/Effects/ScreenShake.gd", "name": "ScreenShake.gd", "extends": "Node", "class_name": "ScreenShake", "docstring": "Tóm tắt: ScreenShake cung cấp hiệu ứng rung màn hình và dừng hình (Hitstop) cho các pha hành động.\n\nChức năng chính:\n- Xử lý dịch chuyển (of e": ""}, {"name": "mizuki", "type": ""}]}}}, "Entities": {"Characters": {"Ena.gd": {"path": "Entities/Characters/Ena.gd", "name": "Ena.gd", "extends": "Entity", "class_name": "Ena", "docstring": "Tóm tắt: Định nghĩa nhân vật Ena (Hệ Happy), quản lý chỉ số và bộ kỹ năng chiến đấu.\n\nChức năng chính:\n- Khởi tạo các chỉ số sức mạnh cơ bản (HP, ATK, DEF, SPD) và danh sách kỹ năng.\n- Thực thi logic kỹ năng [Nét Cọ Tàn Nhẫn]: Gây lượng sát thương vật lý đơn mục tiêu lớn.\n- Thực thi logic kỹ năng [Bức Tranh Độc Đáo]: Gây sát thương và đặt trạng thái Trúng Độc (Poison).\n- Thực thi logic tuyệt kỹ [Kiệt Tác Dang Dở]: Gây sát thương chuẩn (Pure Damage), cộng dồn độc, và hồi máu khẩn cấp cho đồng minh yếu nhất.", "functions": [{"name": "_init", "params": "", "doc": ""}, {"name": "brush_stroke", "params": "target: Entity", "doc": "[Nét Cọ Tàn Nhẫn]: Đòn đơn 150% ATK vật lý."}, {"name": "toxic_criticism", "params": "target: Entity", "doc": "[Bức Tranh Độc Đáo]: Đòn đơn vật lý + Poison 3 lượt (15% HP/lượt)."}, {"name": "masterpiece", "params": "target: Entity", "doc": "[Kiệt Tác Dang Dở]: Tuyệt kỹ - Pure DMG 250% ATK + Poison 4 lượt + hồi máu đồng đội yếu nhất."}], "variables": [{"name": "raw_dmg", "type": ""}, {"name": "scaled_dmg", "type": ""}, {"name": "dmg", "type": ""}, {"name": "multiplier", "type": ""}, {"name": "massive_dmg", "type": ""}, {"name": "lowest_ally", "type": ""}, {"name": "lowest_hp", "type": ""}, {"name": "heal_amount", "type": ""}]}, "Honami.gd": {"path": "Entities/Characters/Honami.gd", "name": "Honami.gd", "extends": "Entity", "class_name": "Honami", "docstring": "Tóm tắt: Định nghĩa nhân vật Honami (Hệ Pure), quản lý chỉ số và bộ kỹ năng chiến đấu.\n\nChức năng chính:\n- Khởi tạo các chỉ số sức mạnh cơ bản (HP, ATK, DEF, SPD) và danh sách kỹ năng (thiên hướng phòng thủ/hồi phục).\n- Ghi đè hàm nhận sát thương `take_damage` để kích hoạt trạng thái bất tử (miễn sát thương) trong các màn cốt truyện đặc biệt.\n- Thực thi logic kỹ năng [Vệt Cắt Xót Thương]: Gây sát thương diện rộng.\n- Thực thi logic kỹ năng [Điểm Tựa Vững Chắc]: Thanh tẩy debuff và hồi máu mạnh cho mục tiêu chỉ định.\n- Thực thi logic tuyệt kỹ [Án Tử Bình Yên]: Xuyên giáp mạnh, nếu kết liễu sẽ hồi nhiều máu cho toàn đội, nếu không kết liễu sẽ Làm Choáng (Stun) và hồi ít máu.", "functions": [{"name": "_init", "params": "", "doc": ""}, {"name": "take_damage", "params": "amount: int, damage_type: String = \"physical\"", "doc": "Khi is_harbor = true (trong trận Harbor): miễn tổn thương hoàn toàn."}, {"name": "merciful_cleave", "params": "_target: Entity", "doc": "[Vệt Cắt Xót Thương]: AoE 80% ATK cho toàn bộ kẻ địch còn sống."}, {"name": "rearguard_stance", "params": "target: Entity", "doc": "[Điểm Tựa Vững Chắc]: Xóa debuff + hồi 30% max_hp cho bản thân và 1 đồng minh."}, {"name": "painless_execution", "params": "target: Entity", "doc": "[Án Tử Bình Yên]: Tuyệt kỹ - bỏ qua 50% DEF. Tiêu diệt → hồi 50% HP đội; sống sót → Stun + hồi 25%."}], "variables": [{"name": "is_harbor", "type": "bool"}, {"name": "dmg", "type": ""}, {"name": "heal_amount", "type": ""}, {"name": "original_def", "type": ""}, {"name": "dmg", "type": ""}, {"name": "killed", "type": ""}]}, "Ichika.gd": {"path": "Entities/Characters/Ichika.gd", "name": "Ichika.gd", "extends": "Entity", "class_name": "Ichika", "docstring": "Tóm tắt: Định nghĩa nhân vật Ichika (Hệ Pure), quản lý chỉ số và bộ kỹ năng chiến đấu.\n\nChức năng chính:\n- Khởi tạo các chỉ số sức mạnh cơ bản (HP, ATK, DEF, SPD) và danh sách kỹ năng của Ichika.\n- Thực thi logic kỹ năng [Xuyên Tâm Kích]: Gây sát thương vật lý mạnh và thêm trạng thái Chảy máu (Bleed).\n- Thực thi logic kỹ năng [Âm Vang Đồng Điệu]: Buff tốc độ (SPD) cho bản thân để giành lợi thế lượt đánh.\n- Thực thi logic tuyệt kỹ [Ảnh Sát]: Gây sát thương khổng lồ và kích nổ toàn bộ hiệu ứng Bleed trên mục tiêu thành sát thương chuẩn (True Damage).", "functions": [{"name": "_init", "params": "", "doc": ""}, {"name": "can_use_skill", "params": "skill_name: String"  kiện kết thúc trận đấu.\n\tTrả về true nếu kịch bản đã xử lý việc kết thúc trận đấu."}, {"name": "get_victory_status", "params": "_main: Node", "doc": "Xác định kết quả thắng hay thua."}, {"name": "on_battle_completed", "params": "_main: Node, _is_victory: bool", "doc": "Gọi sau khi trận đấu đã được xác định kết quả."}], "variables": []}, "BattleTutorial.gd": {"path": "Scripts/Battle/BattleTutorial.gd", "name": "BattleTutorial.gd", "extends": "Node", "class_name": "BattleTutorial", "docstring": "Tóm tắt: BattleTutorial quản lý giao diện hướng dẫn chiến đấu theo từng bước.\n\nChức năng chính:\n- Hiển thị bảng giải thích cơ chế chiến đấu (Turn-based, Action Gauge, Kỹ năng) cho người chơi.\n- Khóa cờ `is_tutorial` trong GameManager để đảm bảo hướng dẫn chỉ hiện một lần duy nhất.\n- Tự động xây dựng UI tùy chỉnh hỗ trợ BBCode và đọc Asset từ thư viện Kenney.", "functions": [], "variables": [{"name": "panel", "type": ""}, {"name": "vbox", "type": "VBoxContainer"}, {"name": "steps", "type": ""}, {"name": "t_lbl", "type": ""}, {"name": "c_lbl", "type": ""}, {"name": "btn", "type": ""}, {"name": "bns", "type": ""}, {"name": "canvas", "type": ""}, {"name": "panel", "type": ""}, {"name": "bg", "type": ""}, {"name": "sb", "type": ""}, {"name": "vbox", "type": ""}]}, "CooldownManager.gd": {"path": "Scripts/Battle/CooldownManager.gd", "name": "CooldownManager.gd", "extends": "Node", "class_name": "CooldownManager", "docstring": "Tóm tắt: CooldownManager quản lý thời gian hồi chiêu (cooldown) của kỹ năng.\n\nChức năng chính:\n- Cung cấp các phương thức tĩnh để đếm ngược cooldown mỗi lượt (`process_cooldowns`).\n- Kiểm tra trạng thái sẵn sàng của kỹ năng (`is_skill_ready`).\n- Thiết lập thời gian chờ sau khi thực thể sử dụng kỹ năng (`set_cooldown`).", "functions": [], "variables": [{"name": "keys", "type": ""}]}, "DamageCalculator.gd": {"path": "Scripts/Battle/DamageCalculator.gd", "name": "DamageCalculator.gd", "extends": "Node", "class_name": "DamageCalculator", "docstring": "Tóm tắt: DamageCalculator phụ trách tính toán lượng sát thương cuối cùng trong trận đấu.\n\nChức năng chính:\n- Cung cấp phương thức tĩnh `calculate_damage` để xử lý công thức sát thương: raw_dmg = (ATK * Multiplier) - DEF.\n- Tự động áp dụng hệ số giảm trừ theo kháng (RES) và tương khắc thuộc tính (thông qua TypeChart).\n- Đảm bảo sát thương tối thiểu gây ra không bao giờ thấp hơn 5% ATK của người tấn công.", "functions": [], "variables": [{"name": "modified_atk", "type": ""}, {"name": "raw_damage", "type": ""}, {"name": "after_res", "type": ""}, {"name": "multiplier", "type": ""}, {"name": "final_damage", "type": ""}, {"name": "min_damage", "type": ""}]}, "ProcessStatus.gd": {"path": "Scripts/Battle/ProcessStatus.gd", "name": "ProcessStatus.gd", "extends": "Node", "class_name": "ProcessStatus", "docstring": "Tóm tắt: ProcessStatus xử lý các hiệu ứng trạng thái (Status Effects) cho thực thể.\n\nChức năng chính:\n- Quản lý logic gây sát thương theo thời gian (DoT) như Poison, Bleed.\n- Xử lý trạng thái khống chế (Stun) và cập nhật thời hạn (duration) của các hiệu ứng đang có trên thực thể vào đầu mỗi lượt (`handle_turn_start`).\n- Tự động xóa các hiệu ứng đã hết thời hạn.", "functions": [], "variables": [{"name": "can_act", "type": ""}, {"name": "statuses_to_remove", "type": ""}, {"name": "bleed_count", "type": ""}, {"name": "bleed_dmg", "type": ""}, {"name": "pct", "type": ""}, {"name": "dmg", "type": ""}]}, "TurnCalculator.gd": {"path": "Scripts/Battle/TurnCalculator.gd", "name": "TurnCalculator.gd", "extends": "Node", "class_name": "TurnCalculator", "docstring": "Tóm tắt: TurnCalculator tính toán thứ tự hành động (Turn Order) dựa trên Action Value (AV).\n\nChức năng chính:\n- Quy đổi chỉ số tốc độ (SPD) thành Action Value (`get_action_value`).\n- Dự báo danh sách lượt đi trong tương lai (`get_timeline`) với cơ chế tie-breaker để giải quyết các trường hợp trùng AV.\n- Lọc bỏ lượt của các thực thể đã bị hạ gục khỏi dòng thời gian (`remove_dead_from_timeline`).", "f ay"}, {"name": "sandbox_enemy_team", "type": "Array"}, {"name": "battle_speed", "type": "float"}, {"name": "master_volume", "type": "float"}, {"name": "skip_battle_unlocked", "type": "bool"}, {"name": "skip_battle_enabled", "type": "bool"}, {"name": "party", "type": "Dictionary"}, {"name": "flags", "type": "Dictionary"}, {"name": "warehouse_wave", "type": "int"}, {"name": "harbor_wave", "type": "int"}, {"name": "enemies_defeated", "type": "int"}, {"name": "harbor_guards_defeated", "type": "int"}, {"name": "harbor_route", "type": "String"}, {"name": "prologue_phase", "type": "int"}, {"name": "harbor_mission_done", "type": "bool"}, {"name": "harbor_mission_unlocked", "type": "bool"}, {"name": "intro_quest_done", "type": "bool"}, {"name": "safehouse_intro_done", "type": "bool"}, {"name": "npcs_greeted", "type": "Array"}, {"name": "warehouse_mission_accepted", "type": "bool"}, {"name": "talked_to_mafuyu_training", "type": "bool"}, {"name": "accepted_harbor_mission", "type": "bool"}, {"name": "harbor_intro_done", "type": "bool"}, {"name": "upgrade_tutorial_done", "type": "bool"}, {"name": "guards_defeated", "type": "bool"}, {"name": "training_ichika_done", "type": "bool"}, {"name": "training_kanade_done", "type": "bool"}, {"name": "harbor_meeting_p1_done", "type": "bool"}, {"name": "mafuyu_honami_talked", "type": "bool"}, {"name": "mizuki_control_phase", "type": "bool"}, {"name": "harbor_mizuki_snack_done", "type": "bool"}, {"name": "SAVE_PATH", "type": ""}, {"name": "save_data", "type": ""}, {"name": "e", "type": ""}, {"name": "f", "type": ""}, {"name": "map_name", "type": ""}, {"name": "f", "type": ""}, {"name": "data", "type": ""}, {"name": "pos", "type": ""}, {"name": "m_state", "type": ""}, {"name": "p_data", "type": ""}, {"name": "e", "type": ""}, {"name": "saves", "type": ""}, {"name": "dir", "type": ""}, {"name": "file_name", "type": ""}, {"name": "bonus_exp", "type": ""}, {"name": "entity", "type": ""}]}, "StoryState.gd": {"path": "Scripts/Core/StoryState.gd", "name": "StoryState.gd", "extends": "Node", "class_name": "StoryState", "docstring": "Tóm tắt: StoryState là vùng nhớ chuyên dụng lưu trữ toàn bộ tiến trình và sự kiện cốt truyện.\n\nChức năng chính:\n- Lưu trữ bộ từ điển `flags` chứa các biến boolean/int để theo dõi trạng thái nhiệm vụ, đối thoại và mở khóa.\n- Lưu trữ biến đếm (wave, kẻ địch tiêu diệt) cho các nhiệm vụ cày cuốc (Warehouse, Harbor).\n- Cung cấp API để `GameManager` dễ dàng thiết lập (set), đọc (get) và khôi phục (reset) trạng thái.\n- Hỗ trợ Serialize/Deserialize dữ liệu sang JSON để phục vụ việc Save/Load Game.", "functions": [{"name": "set_flag", "params": "id: String, value: Variant", "doc": ""}, {"name": "get_flag", "params": "id: String, default: Variant = false", "doc": ""}, {"name": "reset", "params": "", "doc": "Khôi phục toàn bộ tiến trình và dữ liệu nhiệm vụ về trạng thái mặc định.\n\t\n\tArgs: Không có\n\tReturns: Không có"}, {"name": "serialize", "params": "", "doc": "Chuyển đổi toàn bộ dữ liệu trạng thái sang định dạng Dictionary.\n\t\n\tArgs: Không có\n\tReturns:\n\t\tDictionary: Chứa dữ liệu toàn bộ state để lưu."}, {"name": "deserialize", "params": "data: Dictionary", "doc": "Khôi phục trạng thái từ dữ liệu đã được nạp (deserialize).\n\t\n\tArgs:\n\t\tdata (Dictionary): Dữ liệu trạng thái đã lưu.\n\tReturns: Không có"}], "variables": [{"name": "flags", "type": "Dictionary"}, {"name": "warehouse_wave", "type": "int"}, {"name": "harbor_wave", "type": "int"}, {"name": "enemies_defeated", "type": "int"}, {"name": "harbor_guards_defeated", "type": "int"}, {"name": "harbor_route", "type": "String"}]}}, "Overworld": {"InteractableZone.gd": {"path": "Scripts/Overworld/InteractableZone.gd", "name": "InteractableZone.gd", "extends": "Area2D", "class_name": "InteractableZone", "docstring": "Tóm tắt: InteractableZone quản lý các vùng tương tác sự kiện trên bản đồ.\n\nChức năng chính:\n- Tạo một vùng phát hiện va chạm (Area2D) chuyên biệt để nhận diện OverworldPlayer.\n- Tự động hiển thị nhãn gợi ý (Prompt) \"Press ENTER\" khi người chơi nằm trong vùng an toàn.\n- Lắng nghe sự kiện phím (InputEvent) và phát tín hiệu `interacted` khi người chơi bấm nút tương tác.\n- Tích hợp với hệ thống MobileControls để hiển thị phím bấm tương tác ảo trên điện thoại.", "functions": [{"name": "_ready", "params": "", "doc": "Khởi tạo cấu hình cho vùng tương tác và nhãn gợi ý hiển thị.\n\t\n\tThiết lập Collision Layer để không cản trở và Collision Mask để phát hiện \n\tngười chơi (Layer 1). Tạo nhãn gợi ý sử dụng StyleBox từ bộ Assets Kenney."}, {"name": "_on_body_entered", "params": "body", "doc": "Xử lý khi người chơi bước vào vùng tương tác.\n\n\tArgs:\n\t\tbody (Node2D): Đối tượng vừa bước vào vùng."}, {"name": "_on_body_exited", "params": "body", "doc": "Xử lý khi người chơi bước ra khỏi vùng tương tác.\n\n\tArgs:\n\t\tbody (Node2D): Đối tượng vừa bước ra khỏi vùng."}, {"name": "_unhandled_input", "params": "event: InputEvent", "doc": "Xử lý hành động nhấn phím tương tác từ người chơi.\n\n\tĐảm bảo tương tác chỉ xảy ra khi người chơi đang ở trong vùng và không \n\tđang trong trạng thái hội thoại. Sử dụng set_input_as_handled để ngăn \n\tchặn sự kiện phím lan truyền sang các đối tượng khác.\n\n\tArgs:\n\t\tevent (InputEvent): Sự kiện đầu vào từ bàn phím."}, {"name": "_process", "params": "_delta", "doc": "Cập nhật trạng thái hiển thị của nhãn gợi ý theo thời gian thực."}], "variables": [{"name": "prompt_label", "type": "Label"}, {"name": "is_player_inside", "type": "bool"}, {"name": "prompt_text", "type": "String"}, {"name": "pb", "type": ""}]}, "OverworldPlayer.gd": {"path": "Scripts/Overworld/OverworldPlayer.gd", "name": "OverworldPlayer.gd", "extends": "CharacterBody2D", "class_name": "OverworldPlayer", "docstring": "Tóm tắt: OverworldPlayer điều khiển nhân vật người chơi trong thế giới khám phá (Overworld).\n\nChức năng chính:\n- Khởi tạo hitbox vật lý, camera và hình ảnh đại diện (Marker) cho người chơi.\n- Xử lý hệ thống di chuyển đa hướng (8 hướng) bằng cả bàn phím (WASD/Mũi tên) và tay cầm/joystick.\n- Tự động tìm kiếm và xoay mũi tên hướng dẫn (Objective Arrow) về phía mục tiêu nhiệm vụ gần nhất.\n- Hỗ trợ khóa di chuyển khi đang trong trạng thái hội thoại.", "functions": [{"name": "_ready", "params": "", "doc": "Khởi tạo các thành phần cốt lõi của người chơi.\n\t\n\tThiết lập va chạm, Marker đại diện, mũi tên chỉ đường, Hitbox vật lý \n\tvà Camera theo chân. Tự động khôi phục vị trí từ GameManager nếu có."}, {"name": "_process", "params": "_delta", "doc": "Cập nhật logic hình ảnh không liên quan đến vật lý (Mũi tên mục tiêu)."}, {"name": "_update_objective_arrow", "params": "", "doc": "Xác định và chỉ hướng tới mục tiêu nhiệm vụ gần nhất.\n\t\n\tQuét các Node trong nhóm 'objectives', tính toán khoảng cách và xoay \n\tmũi tên hướng về phía đối tượng gần nhất."}, {"name": "_physics_process", "params": "_delta", "doc": "Xử lý di chuyển vật lý và điều khiển đầu vào từ người chơi.\n\n\tNếu đang trong trạng thái hội thoại, vận tốc sẽ được đặt về 0. \n\tMarker của người chơi sẽ tự động chuyển đổi giữa hình tròn (đứng yên) \n\tvà hình mũi tên (di chuyển) dựa trên vector vận tốc."}, {"name": "_draw_dot", "params": "", "doc": "Vẽ hình tròn đơn giản đại diện cho trạng thái đứng yên của người chơi."}, {"name": "_draw_arrow", "params": "dir: Vector2", "doc": "Vẽ hình mũi tên đa giác chỉ hướng di chuyển hiện tại.\n\n\tArgs:\n\t\tdir (Vector2): Vector hướng di chuyển của nhân vật."}], "variables": [{"name": "SPEED", "type": ""}, {"name": "character_color", "type": "Color"}, {"name": "_marker", "type": "Polygon2D"}, {"name": "_objective_arrow", "type": "Sprite2D"}, {"name": "_last_dir", "type": "Vector2"}, {"name": "arrow_tex", "type": ""}, {"name": "shape", "type": ""}, {"name": "rect", "type": ""}, {"name": "camera", "type": ""}, {"name": "objectives", "type": ""}, {"name": "closest", "type": "Node2D"}, {"name": "min_dist", "type": ""}, {"name": "d", "type": ""}, {"name": "dir", "type": ""}, {"name": "input_dir", "type": ""}, {"name": "points", "type": ""}, {"name": "r", "type": ""}, {"name": "sides", "type": ""}, {"name": "angle", "type": ""}, {"name": "norm", "type": ""}, {"name": "perp", "type": ""}, {"name": "tip", "type": ""}, {"name": "base_left", "type": ""}, {"name": "base_right", "type": ""}]}}, "Systems": {"AudioManager.gd": {"path": "Scripts/Systems/AudioManager.gd", "name": "AudioManager.gd", "extends": "Node", "class_name": "", "docstring": "Tóm tắt: AudioManager là Node Autoload chịu trách nhiệm quản lý phát nhạc nền toàn cục.\n\nChức năng chính:\n- Duy trì việc phát nhạc nền (BGM) xuyên suốt các cảnh chơi mà không bị ngắt quãng.\n- Cung cấp tính năng chuyển đổi bài nhạc mượt mà thông qua hiệu ứng Fade In/Fade Out (Tween âm lượng).\n- Lưu trữ danh sách đường dẫn các bài nhạc thường dùng qua hằng số `TRACKS`.\n- Cung cấp API `update_volume` cho phép tùy chỉnh âm lượng tổng (Master Bus) thông qua Settings.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "play_music", "params": "track_name: String, fade_duration: float = 1.0", "doc": "Phát một bài nhạc nền có sẵn trong thư mục Music.\n\t\n\tArgs:\n\t\ttrack_name (String): Tên định danh của bài nhạc.\n\t\tfade_duration (float): Thời gian làm mờ khi chuyển bài (giây).\n\tReturns: Không có"}, {"name": "stop_music", "params": "fade_duration: float = 1.0", "doc": "Dừng phát nhạc nền hiện tại kèm hiệu ứng giảm âm dần.\n\t\n\tArgs:\n\t\tfade_duration (float): Thời gian làm mờ (giây) trước khi tắt hẳn.\n\tReturns: Không có"}, {"name": "update_volume", "params": "value: float", "doc": ""}], "variables": [{"name": "_player", "type": "AudioStreamPlayer"}, {"name": "_current_track", "type": "String"}, {"name": "MUSIC_DIR", "type": ""}, {"name": "TRACKS", "type": ""}, {"name": "new_stream", "type": ""}, {"name": "tween", "type": ""}, {"name": "tween", "type": ""}, {"name": "tween", "type": ""}, {"name": "bus_index", "type": ""}, {"name": "db", "type": ""}]}, "DialogueLoader.gd": {"path": "Scripts/Systems/DialogueLoader.gd", "name": "DialogueLoader.gd", "extends": "Node", "class_name": "", "docstring": "Tóm tắt: DialogueLoader là Node hệ thống có nhiệm vụ nạp và xử lý toàn bộ dữ liệu hội thoại từ các file JSON.\n\nChức năng chính:\n- Tự động quét toàn bộ thư mục `res://Data/storyline/` lúc khởi động game.\n- Phân tích cú pháp (parse) và chuyển đổi các file JSON thành một Dictionary `_data` tập trung trên bộ nhớ.\n- Cung cấp API `get_lines(key)` để trích xuất và chuẩn hóa dữ liệu dòng thoại (xác định loại thoại, người nói, màu sắc, vị trí chân dung) cho `DialogueManager` sử dụng.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "_load_json", "params": "", "doc": "Quét thư mục chứa hội thoại và tải tuần tự từng tệp JSON tìm thấy.\n\t\n\tArgs: Không có\n\tReturns: Không có"}, {"name": "_load_single_file", "params": "file_path: String", "doc": "Tải một tệp JSON đơn lẻ và gộp nội dung vào bộ nhớ đệm dùng chung.\n\t\n\tArgs:\n\t\tfile_path (String): Đường dẫn tuyệt đối đến tệp JSON cần nạp.\n\tReturns: Không có"}, {"name": "get_lines", "params": "key: String", "doc": "Lấy và chuẩn hóa danh sách các dòng thoại tương ứng với một khóa (key) chỉ định.\n\t\n\tArgs:\n\t\tkey (String): Khóa định danh hội thoại trong file JSON.\n\tReturns:\n\t\tArray: Mảng các dòng thoại đã chuẩn hóa (chứa type, text, name, speaker, color). Trả về mảng trống nếu không tìm thấy."}], "variables": [{"name": "_data", "type": "Dictionary"}, {"name": "path", "type": ""}, {"name": "dir", "type": ""}, {"name": "file_name", "type": ""}, {"name": "f", "type": ""}, {"name": "text", "type": ""}, {"name": "parsed", "type": "Variant"}, {"name": "new_data", "type": "Dictionary"}, {"name": "raw", "type": "Array"}, {"name": "out", "type": "Array"}, {"name": "line", "type": "Dictionary"}, {"name": "hex", "type": "String"}]}, "LevelManager.gd": {"path": "Scripts/Systems/LevelManager.gd", "name": "LevelManager.gd", "extends": "Node", "class_name": "LevelManager", "docstring": "Tóm tắt: LevelManager là lớp tĩnh (Static Class) chuyên trách tính toán kinh nghiệm và thăng cấp nhân vật.\n\nChức năng chính:\n- Xử lý việc cấp và cộng dồn điểm kinh nghiệm (EXP) thông qua hàm `gain_exp()`.\n- Tự động tính toán số cấp thăng lên nếu điểm EXP vượt mức, xử lý chuỗi lên cấp liên tục.\n- Cung cấp thuật toán gia tăng chỉ số gốc dựa trên tỷ lệ % (Growth Rate) và áp dụng cơ chế Soft Cap/Hard Cap.\n- Tự động phân bổ Điểm Kỹ Năng (SP) ngẫu nhiên cho hệ thống quái vật để tạo độ khó biến thiên.", "functions": [], "variables": [{"name": "SOFT_CAP_LEVEL", "type": ""}, {"name": "MAX_LEVEL", "type": ""}, {"name": "growth_rate", "type": ""}, {"name": "spd_growth", "type": ""}, {"name": "exp_curve", "type": ""}, {"name": "levels_to_gain", "type": ""}, {"name": "stats", "type": ""}, {"name": "attempts", "type": ""}, {"name": "stat", "type": ""}]}, "UpgradeManager.gd": {"path": "Scripts/Systems/UpgradeManager.gd", "name": "UpgradeManager.gd", "extends": "Node", "class_name": "UpgradeManager", "docstring": "Tóm tắt: UpgradeManager là lớp tĩnh (Static Class) phụ trách logic sử dụng Điểm Kỹ Năng (SP) để nâng cấp chỉ số.\n\nChức năng chính:\n- Xác định chi phí SP và hệ số gia tăng cơ bản cho mỗi loại chỉ số (HP, ATK, DEF, SPD).\n- Cung cấp API `upgrade_stat` để kiểm tra điều kiện (đủ SP, chưa đạt giới hạn Max Cap) và thực hiện cộng chỉ số.\n- Cung cấp API `bulk_upgrade` giúp thực hiện nâng cấp hàng loạt hoặc nâng tối đa chỉ số chỉ trong một lần bấm để tăng tính tiện dụng cho UI.", "functions": [], "variables": [{"name": "UPGRADE_COST", "type": ""}, {"name": "UPGRADE_AMOUNTS", "type": ""}, {"name": "current_val", "type": ""}, {"name": "cap_val", "type": ""}, {"name": "increment", "type": ""}, {"name": "actual_increment", "type": ""}, {"name": "upgrades_done", "type": ""}]}}}, "UI": {"Battle": {"ActionGauge.gd": {"path": "UI/Battle/ActionGauge.gd", "name": "ActionGauge.gd", "extends": "VBoxContainer", "class_name": "ActionGauge", "docstring": "Tóm tắt: ActionGauge hiển thị danh sách thứ tự hành động (Timeline) trong trận đấu.\n\nChức năng chính:\n- Trực quan hóa danh sách các lượt đánh sắp tới (tối đa 10 lượt).\n- Sử dụng màu sắc để phân biệt giữa phe người chơi (Xanh) và phe địch (Đỏ).\n- Cập nhật linh hoạt thông qua hàm `refresh` mỗi khi có thay đổi trong timeline.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "set_player_team", "params": "team: Array", "doc": "Thiết lập danh sách thực thể phe người chơi để phục vụ việc tô màu.\n\n\tArgs:\n\t\tteam (Array): Mảng các thực thể Entity thuộc phe ta."}, {"name": "refresh", "params": "timeline: Array, current_actor: Entity = null", "doc": "Cập nhật và vẽ lại toàn bộ danh sách thứ tự lượt.\n\n\tArgs:\n\t\ttimeline (Array): Mảng các Dictionary chứa thông tin lượt (entity, tick).\n\t\tcurrent_actor (Entity): Thực thể đang thực hiện lượt hiện tại."}], "variables": [{"name": "PLAYER_COLOR", "type": ""}, {"name": "ENEMY_COLOR", "type": ""}, {"name": "player_team", "type": "Array"}, {"name": "header", "type": ""}, {"name": "sep", "type": ""}, {"name": "display_list", "type": ""}, {"name": "data", "type": ""}, {"name": "entity", "type": ""}, {"name": "is_current", "type": ""}, {"name": "entry_name", "type": ""}, {"name": "is_player", "type": ""}, {"name": "row", "type": ""}, {"name": "num", "type": ""}, {"name": "icon", "type": ""}, {"name": "lbl", "type": ""}]}, "BattleHUD.gd": {"path": "UI/Battle/BattleHUD.gd", "name": "BattleHUD.gd", "extends": "CanvasLayer", "class_name": "", "docstring": "Tóm tắt: BattleHUD là lớp điều phối giao diện chính trong trận chiến.\n\nChức năng chính:\n- Quản lý việc xây dựng và cập nhật các thành phần UI cốt lõi như: Thanh hành động (Action Gauge), Thẻ nhân vật (Character Cards) và Menu lệnh (Command Menu).\n- Cung cấp các hàm hiển thị thông báo trận đấu: Đến lượt (Turn Indicator), Chiến thắng (Victory), Thất bại (Defeat).\n- Kết nối các nút chức năng phụ như 'Bỏ qua trận đấu' (Skip) và 'Chi tiết chỉ số' (Info).", "functions": [{"name": "setup", "params": "players: Array, enemies: Array", "doc": "Khởi tạo dữ liệu và xây dựng toàn bộ cây Node giao diện.\n\n\t- players: Danh sách các thực thể phe người chơi (Array).\n\t- enemies: Danh sách các thực thể phe đối phương (Array)."}, {"name": "_build_ui", "params": "", "doc": "Xây dựng cấu trúc giao diện theo bố cục định sẵn.\n\t\n\tBố cục bao gồm: Gauge ở góc trên, thẻ nhân vật hai bên cánh, \n\tvà Menu lệnh được căn giữa phía dưới."}, {"name": "_on_info_pressed", "params": "", "doc": "Mở bảng thông số chi tiết của toàn bộ thực thể trên sân."}, {"name": "show_turn_indicator", "params": "entity: Entity", "doc": "Hiển thị thông báo khi đến lượt của một thực thể cụ thể.\n\n\tArgs:\n\t\tentity (Entity): Thực thể vừa bắt đầu lượt."}, {"name": "show_victory", "params": "", "doc": "Hiển thị banner thông báo chiến thắng."}, {"name": "show_defeat", "params": "", "doc": "Hiển thị banner thông báo thất bại."}, {"name": "_create_banner", "params": "txt: String, color: Color", "doc": "Khởi tạo một dải banner thông báo chuẩn hóa.\n\t\n\tSử dụng texture 'banner_modern' dẹt và cố định kích thước 280x42 \n\tđể đảm bảo tính thẩm mỹ.\n\n\tArgs:\n\t\ttxt (String): Nội dung chữ hiển thị trên banner.\n\t\tcolor (Color): Màu sắc của phông chữ.\n\t\t\n\tReturns:\n\t\tPanelContainer: Đối tượng banner đã được cấu hình."}], "variables": [{"name": "player_team", "type": "Array"}, {"name": "enemy_team", "type": "Array"}, {"name": "ActionGaugeClass", "type": ""}, {"name": "CharacterCardClass", "type": ""}, {"name": "CommandMenuClass", "type": ""}, {"name": "EntityDetailPanelClass", "type": ""}, {"name": "card_container", "type": "VBoxContainer"}, {"name": "enemy_container", "type": "VBoxContainer"}, {"name": "action_gauge", "type": "Node"}, {"name": "command_menu", "type": "Node"}, {"name": "_info_panel", "type": "Node"}, {"name": "card", "type": ""}, {"name": "card", "type": ""}, {"name": "skip_btn", "type": ""}, {"name": "info_btn", "type": ""}, {"name": "banner", "type": ""}, {"name": "tw", "type": ""}, {"name": "banner", "ty pgradeUI.gd", "extends": "CanvasLayer", "class_name": "", "docstring": "Tóm tắt: UpgradeUI là hệ thống giao diện cho phép người chơi nâng cấp chỉ số nhân vật.\n\nChức năng chính:\n- Khởi tạo bảng UI động hiển thị danh sách các nhân vật trong đội hình.\n- Lấy và hiển thị các chỉ số hiện tại (HP, ATK, DEF, SPD) và Điểm Kỹ Năng (SP) của nhân vật được chọn.\n- Xây dựng cụm nút nâng cấp (+1, +10, +25, MAX) kết nối trực tiếp với API của `UpgradeManager`.\n- Tự động khóa sự kiện di chuyển của người chơi (thông qua `GameManager.start_dialogue()`) khi đang hiển thị.", "functions": [{"name": "_ready", "params": "", "doc": ""}, {"name": "show_ui", "params": "chars: Array[Entity]", "doc": "Hiển thị giao diện nâng cấp với danh sách nhân vật hiện có.\n\t\n\tArgs:\n\t\tchars (Array[Entity]): Danh sách các nhân vật có thể nâng cấp.\n\tReturns: Không có"}, {"name": "_build_ui", "params": "", "doc": ""}, {"name": "_refresh_all", "params": "", "doc": ""}], "variables": [{"name": "THEME_COLOR", "type": ""}, {"name": "BG_COLOR", "type": ""}, {"name": "characters", "type": "Array"}, {"name": "selected_index", "type": "int"}, {"name": "char_list", "type": "VBoxContainer"}, {"name": "stat_vbox", "type": "VBoxContainer"}, {"name": "sp_label", "type": "Label"}, {"name": "char_name_label", "type": "Label"}, {"name": "panel", "type": ""}, {"name": "sb", "type": ""}, {"name": "bg", "type": ""}, {"name": "main_hbox", "type": ""}, {"name": "left_vbox", "type": ""}, {"name": "list_title", "type": ""}, {"name": "right_vbox", "type": ""}, {"name": "sep", "type": ""}, {"name": "close_btn", "type": ""}, {"name": "btn", "type": ""}, {"name": "ns", "type": ""}, {"name": "entity", "type": ""}, {"name": "stats_to_show", "type": ""}, {"name": "labels", "type": ""}, {"name": "row", "type": ""}, {"name": "name_lbl", "type": ""}, {"name": "val_lbl", "type": ""}, {"name": "btn_container", "type": ""}, {"name": "create_up_btn", "type": ""}, {"name": "b", "type": ""}, {"name": "bns", "type": ""}, {"name": "inc_l const aside = document.getElementById('sidebar');
function buildTree(node, parent, depth=0){
  for(const [key, val] of Object.entries(node)){
    if(val.path){
      const el = document.createElement('div');
      el.className='tree-item';
      el.style.paddingLeft=(12+depth*14)+'px';
      el.innerHTML=`<span class="icon-file">📄</span> ${key}`;
      el.dataset.path = val.path;
      el.onclick=()=>showFile(val, el);
      parent.appendChild(el);
    } else {
      const folder = document.createElement('div');
      folder.className='tree-folder';
      folder.style.paddingLeft=(12+depth*14)+'px';
      folder.innerHTML=`<span class="arrow">▶</span><span class="icon-folder">📁</span> ${key}`;
      parent.appendChild(folder);
      const children = document.createElement('div');
      children.className='tree-children';
      parent.appendChild(children);
      buildTree(val, children, depth+1);
      folder.onclick=()=>{
        folder.classList.toggle('open');
        children.classList.toggle('open');
      };
    }
  }
}
buildTree(DATA.tree, aside);
let activeEl = null;
function showFile(f, el){
  if(activeEl){ activeEl.classList.remove('active'); }
  el.classList.add('active');
  activeEl = el;
  const main = document.getElementById('main');
  const path = f.path;
  const vars = (f.variables||[]).filter(v=>!v.name.startsWith('_'));
  const fns  = f.functions||[];
  let html = `<div class="file-header">
    <h2>📄 ${f.name}</h2>
    <div style="color:var(--muted);font-size:.8rem;margin-top:2px">${path}</div>
    <div class="meta">`;
  if(f.class_name) html+=`<span class="badge">${f.class_name}</span>`;
  if(f.extends)    html+=`<span class="badge ext">extends ${f.extends}</span>`;
  html+=`</div></div>`;
  if(f.docstring) html+=`<div class="docstring">${esc(f.docstring)}</div>`;
  if(vars.length){
    html+=`<h3>Thuộc tính (${vars.length})</h3>
    <table class="var-table"><thead><tr><th>Tên</th><th>Kiểu</th></tr></thead><tbody>`;
    vars.forEach(v=>{
      html+=`<tr><td class="vname">${esc(v.name)}</td><td class="vtype">${esc(v.type)}</td></tr>`;
    });
    html+=`</tbody></table>`;
  }
  if(fns.length){
    html+=`<h3>Hàm (${fns.length})</h3>`;
    fns.forEach((fn,i)=>{
      const id=`fn${i}`;
      html+=`<div class="fn-card" id="${id}">
        <div class="fn-sig" onclick="toggle('${id}')">
          <span class="fn-kw">func</span>
          <span class="fn-name">${esc(fn.name)}</span>
          <span class="fn-params">(${esc(fn.params)})</span>
        </div>`;
      if(fn.doc) html+=`<div class="fn-doc">${esc(fn.doc)}</div>`;
      html+=`</div>`;
    });
  }
  main.innerHTML = html;
}
function toggle(id){
  document.getElementById(id).classList.toggle('open');
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('search').addEventListener('input', function(){
  const q = this.value.toLowerCase();
  document.querySelectorAll('.tree-item').forEach(el=>{
    const match = el.dataset.path.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
  });
  document.querySelectorAll('.tree-children').forEach(ch=>{
    const hasVisible = [...ch.querySelectorAll('.tree-item')].some(e=>e.style.display!=='none');
    const folder = ch.previousElementSibling;
    if(hasVisible){ ch.classList.add('open'); folder && folder.classList.add('open'); }
    else { ch.classList.remove('open'); folder && folder.classList.remove('open'); }
  });
});
