<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="12" ry="3" fill="rgba(15,23,42,0.3)" shape-rendering="geometricPrecision"/>
  <!-- Hydraulic Treads / Feet -->
  <rect x="15" y="40" width="7" height="5" fill="#334155"/>
  <rect x="26" y="40" width="7" height="5" fill="#334155"/>
  <!-- Leg Struts -->
  <rect x="17" y="32" width="4" height="8" fill="#475569"/>
  <rect x="27" y="32" width="4" height="8" fill="#475569"/>
  <!-- Armored Chassis / Torso -->
  <rect x="14" y="18" width="20" height="15" fill="#334155"/>
  <rect x="16" y="20" width="16" height="11" fill="#475569"/>
  <!-- Hazard Caution Stripes (Vàng/Đen) -->
  <polygon points="16,28 20,28 18,31 16,31" fill="#eab308"/>
  <polygon points="22,28 26,28 24,31 22,31" fill="#eab308"/>
  <polygon points="28,28 32,28 30,31 28,31" fill="#eab308"/>
  <!-- Piston Arms & Claws -->
  <rect x="10" y="21" width="4" height="11" fill="#475569"/>
  <rect x="34" y="21" width="4" height="11" fill="#475569"/>
  <polygon points="9,32 14,32 12,36" fill="#94a3b8"/>
  <polygon points="34,32 39,32 36,36" fill="#94a3b8"/>
  <!-- Robot Head -->
  <rect x="16" y="8" width="16" height="11" rx="2" fill="#334155"/>
  <rect x="18" y="10" width="12" height="7" fill="#0f172a"/>
  <!-- Optical Blue Scanner Visor -->
  <rect x="19" y="12" width="10" height="3" fill="#38bdf8"/>
  <rect x="23" y="12.5" width="3" height="2" fill="#ffffff"/>
  <!-- Antenna -->
  <rect x="23" y="4" width="2" height="4" fill="#94a3b8"/>
  <circle cx="24" cy="3" r="1.5" fill="#ef4444"/>
</svg>
