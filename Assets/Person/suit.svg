<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="12" ry="3.5" fill="rgba(15,23,42,0.3)" shape-rendering="geometricPrecision"/>
  <!-- Polished Oxford Dress Shoes -->
  <rect x="16" y="41" width="6" height="4" fill="#09090b"/>
  <rect x="26" y="41" width="6" height="4" fill="#09090b"/>
  <rect x="18" y="41" width="2" height="1" fill="#27272a"/>
  <rect x="28" y="41" width="2" height="1" fill="#27272a"/>
  <!-- Tailored Charcoal Suit Trousers -->
  <rect x="17" y="32" width="5" height="10" fill="#18181b"/>
  <rect x="26" y="32" width="5" height="10" fill="#18181b"/>
  <!-- Three-piece Suit Jacket Body -->
  <rect x="14" y="19" width="20" height="14" fill="#18181b"/>
  <rect x="16" y="20" width="16" height="12" fill="#27272a"/>
  <!-- White Dress Shirt V & Burgundy Silk Tie -->
  <polygon points="21,19 27,19 24,26" fill="#f8fafc"/>
  <polygon points="23,20 25,20 24.5,28 23.5,28" fill="#991b1b"/>
  <!-- Gold Tie Clip & Presidential Lapel Pin -->
  <rect x="23" y="24" width="2.5" height="1" fill="#facc15"/>
  <circle cx="18" cy="22" r="1" fill="#facc15"/>
  <!-- Arms & Cufflinks -->
  <rect x="11" y="20" width="4" height="11" fill="#18181b"/>
  <rect x="33" y="20" width="4" height="11" fill="#18181b"/>
  <rect x="11" y="30" width="4" height="1" fill="#f8fafc"/>
  <rect x="33" y="30" width="4" height="1" fill="#f8fafc"/>
  <rect x="11" y="31" width="4" height="3" fill="#fed7aa"/>
  <rect x="33" y="31" width="4" height="3" fill="#fed7aa"/>
  <!-- Face & Cold Smug Expression -->
  <rect x="16" y="10" width="16" height="10" fill="#ffedd5"/>
  <!-- Narrow Calculating Eyes -->
  <rect x="18" y="14" width="3.5" height="1.8" fill="#18181b"/>
  <rect x="26.5" y="14" width="3.5" height="1.8" fill="#18181b"/>
  <!-- Gold-rimmed Glasses -->
  <rect x="17.5" y="13.5" width="4.5" height="2.5" fill="none" stroke="#eab308" stroke-width="0.8"/>
  <rect x="26" y="13.5" width="4.5" height="2.5" fill="none" stroke="#eab308" stroke-width="0.8"/>
  <line x1="22" y1="14.5" x2="26" y2="14.5" stroke="#eab308" stroke-width="0.8"/>
  <!-- Swept-Back Distinguished Silver/Grey Hair -->
  <rect x="15" y="6" width="18" height="5.5" fill="#94a3b8"/>
  <polygon points="15,6 33,6 30,2 18,2" fill="#cbd5e1"/>
  <rect x="14" y="9" width="2" height="4" fill="#94a3b8"/>
  <rect x="32" y="9" width="2" height="4" fill="#94a3b8"/>
</svg>
