<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="13" ry="3.5" fill="rgba(6,182,212,0.25)" shape-rendering="geometricPrecision"/>
  <!-- Heavy Mechanized Metal Greaves -->
  <rect x="14" y="39" width="8" height="6" fill="#1e293b"/>
  <rect x="26" y="39" width="8" height="6" fill="#1e293b"/>
  <rect x="16" y="42" width="4" height="1.5" fill="#06b6d4"/>
  <rect x="28" y="42" width="4" height="1.5" fill="#06b6d4"/>
  <!-- Armored Cybernetic Legs -->
  <rect x="15" y="31" width="6" height="9" fill="#334155"/>
  <rect x="27" y="31" width="6" height="9" fill="#334155"/>
  <!-- Heavy Armored Torso / Kinetic Barrier Generator -->
  <rect x="13" y="18" width="22" height="14" fill="#0f172a"/>
  <rect x="15" y="19" width="18" height="12" fill="#1e293b"/>
  <!-- Glowing Cyan Reactor Core -->
  <circle cx="24" cy="24" r="3" fill="#06b6d4"/>
  <circle cx="24" cy="24" r="1.5" fill="#ffffff"/>
  <!-- Circuit Traces -->
  <line x1="24" y1="27" x2="24" y2="31" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="21" y1="24" x2="16" y2="24" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="27" y1="24" x2="32" y2="24" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Heavy Pauldrons (Giáp vai cơ khí) -->
  <rect x="9" y="17" width="6" height="7" fill="#475569"/>
  <rect x="33" y="17" width="6" height="7" fill="#475569"/>
  <rect x="10" y="19" width="4" height="1" fill="#06b6d4"/>
  <rect x="34" y="19" width="4" height="1" fill="#06b6d4"/>
  <!-- Cybernetic Arms & Hydraulic Gauntlets -->
  <rect x="10" y="24" width="5" height="9" fill="#1e293b"/>
  <rect x="33" y="24" width="5" height="9" fill="#1e293b"/>
  <!-- Mechanized Helm & Visor -->
  <rect x="14" y="7" width="20" height="12" rx="3" fill="#1e293b"/>
  <rect x="16" y="9" width="16" height="8" fill="#0f172a"/>
  <!-- Visor Neon Cyan Ocular Band -->
  <rect x="17" y="11" width="14" height="3" fill="#06b6d4"/>
  <rect x="22" y="11.5" width="4" height="2" fill="#ffffff"/>
</svg>
