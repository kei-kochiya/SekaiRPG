<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="11" ry="3" fill="rgba(15,23,42,0.3)" shape-rendering="geometricPrecision"/>
  <!-- Biker Boots with Silver Buckles -->
  <rect x="16" y="40" width="6" height="5" fill="#09090b"/>
  <rect x="26" y="40" width="6" height="5" fill="#09090b"/>
  <rect x="18" y="41" width="2" height="1" fill="#cbd5e1"/>
  <rect x="28" y="41" width="2" height="1" fill="#cbd5e1"/>
  <!-- Ripped Dark Jeans -->
  <rect x="17" y="31" width="5" height="10" fill="#1e293b"/>
  <rect x="26" y="31" width="5" height="10" fill="#1e293b"/>
  <rect x="18" y="34" width="3" height="1.5" fill="#09090b"/>
  <rect x="27" y="36" width="3" height="1.5" fill="#09090b"/>
  <!-- Studded Belt -->
  <rect x="16" y="29" width="16" height="2.5" fill="#0f172a"/>
  <circle cx="20" cy="30" r="0.8" fill="#e2e8f0"/>
  <circle cx="24" cy="30" r="0.8" fill="#e2e8f0"/>
  <circle cx="28" cy="30" r="0.8" fill="#e2e8f0"/>
  <!-- Biker Leather Jacket (Đỏ rượu & Đen) -->
  <rect x="14" y="19" width="20" height="11" fill="#881337"/>
  <rect x="16" y="20" width="16" height="9" fill="#9f1239"/>
  <!-- Asymmetric Zipper & Silver Chain -->
  <line x1="21" y1="20" x2="25" y2="29" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M 21,21 Q 24,25 27,21" fill="none" stroke="#94a3b8" stroke-width="1.5" shape-rendering="geometricPrecision"/>
  <!-- Arms & Spiked Bracers -->
  <rect x="11" y="20" width="4" height="10" fill="#881337"/>
  <rect x="33" y="20" width="4" height="10" fill="#881337"/>
  <rect x="11" y="28" width="4" height="3" fill="#09090b"/>
  <rect x="33" y="28" width="4" height="3" fill="#09090b"/>
  <!-- Face & Scowl -->
  <rect x="16" y="11" width="16" height="9" fill="#ffedd5"/>
  <rect x="18" y="14" width="3" height="2" fill="#881337"/>
  <rect x="27" y="14" width="3" height="2" fill="#881337"/>
  <!-- Pierced Ear & Scar -->
  <circle cx="15.5" cy="14" r="0.8" fill="#e2e8f0"/>
  <line x1="26" y1="12" x2="29" y2="17" stroke="#e11d48" stroke-width="1"/>
  <!-- Slicked Back Dark Purple Hair -->
  <rect x="15" y="6" width="18" height="6" fill="#3b0764"/>
  <polygon points="15,6 33,6 30,3 18,3" fill="#581c87"/>
</svg>
