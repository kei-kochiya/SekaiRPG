<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="11" ry="3" fill="rgba(15,23,42,0.3)" shape-rendering="geometricPrecision"/>
  <!-- Stealth Boots -->
  <rect x="16" y="40" width="6" height="5" fill="#0f172a"/>
  <rect x="26" y="40" width="6" height="5" fill="#0f172a"/>
  <!-- Camouflage Dark Pants -->
  <rect x="17" y="31" width="5" height="10" fill="#1e293b"/>
  <rect x="26" y="31" width="5" height="10" fill="#1e293b"/>
  <!-- Sniper Cape / Cloak Body -->
  <polygon points="12,20 36,20 38,38 10,38" fill="#0f172a"/>
  <polygon points="15,22 33,22 35,36 13,36" fill="#1e293b"/>
  <!-- Ammo Bandolier across chest -->
  <line x1="16" y1="21" x2="31" y2="33" stroke="#b45309" stroke-width="2"/>
  <circle cx="21" cy="25" r="1" fill="#facc15"/>
  <circle cx="25" cy="28" r="1" fill="#facc15"/>
  <circle cx="29" cy="31" r="1" fill="#facc15"/>
  <!-- Cloaked Hood Head -->
  <rect x="14" y="6" width="20" height="15" rx="3" fill="#0f172a"/>
  <rect x="16" y="8" width="16" height="12" fill="#020617"/>
  <!-- Cybernetic Optical Targeting Scope (Mắt ngắm laze đỏ) -->
  <rect x="18" y="11" width="5" height="4" fill="#0f172a"/>
  <circle cx="20.5" cy="13" r="1.5" fill="#ef4444"/>
  <circle cx="20.5" cy="13" r="0.6" fill="#ffffff"/>
  <!-- Human Eye (Hidden in shadow) -->
  <rect x="26" y="12" width="3" height="2" fill="#334155"/>
  <!-- Half-Face Respirator / Filter -->
  <rect x="19" y="15" width="10" height="5" fill="#1e293b"/>
  <circle cx="24" cy="17.5" r="1.2" fill="#065f46"/>
</svg>
