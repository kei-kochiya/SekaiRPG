<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="13" ry="3.5" fill="rgba(15,23,42,0.35)" shape-rendering="geometricPrecision"/>
  <!-- Polished Officer Boots -->
  <rect x="15" y="40" width="7" height="5" fill="#09090b"/>
  <rect x="26" y="40" width="7" height="5" fill="#09090b"/>
  <!-- Trench Coat Skirt (Áo măng tô dài) -->
  <polygon points="12,30 36,30 39,41 9,41" fill="#18181b"/>
  <!-- Gold trim along coat opening -->
  <line x1="24" y1="20" x2="24" y2="41" stroke="#d97706" stroke-width="1.5"/>
  <!-- Heavy Overcoat Body -->
  <rect x="13" y="18" width="22" height="13" fill="#18181b"/>
  <rect x="15" y="19" width="18" height="11" fill="#27272a"/>
  <!-- Double-breasted Gold Buttons -->
  <circle cx="20" cy="23" r="1" fill="#facc15"/>
  <circle cx="28" cy="23" r="1" fill="#facc15"/>
  <circle cx="20" cy="27" r="1" fill="#facc15"/>
  <circle cx="28" cy="27" r="1" fill="#facc15"/>
  <!-- Captain Epaulets & Sash -->
  <rect x="11" y="18" width="5" height="3" fill="#eab308"/>
  <rect x="32" y="18" width="5" height="3" fill="#eab308"/>
  <line x1="14" y1="18" x2="33" y2="28" stroke="#dc2626" stroke-width="2"/>
  <!-- Arms & Officer Gloves -->
  <rect x="9" y="20" width="5" height="11" fill="#18181b"/>
  <rect x="34" y="20" width="5" height="11" fill="#18181b"/>
  <rect x="9" y="29" width="5" height="4" fill="#09090b"/>
  <rect x="34" y="29" width="5" height="4" fill="#09090b"/>
  <!-- Face & Stubble -->
  <rect x="16" y="11" width="16" height="9" fill="#fed7aa"/>
  <rect x="17" y="17" width="14" height="3" fill="#a16207" opacity="0.4"/>
  <!-- Piercing Eyes & Scar -->
  <line x1="18" y1="11" x2="20" y2="16" stroke="#b91c1c" stroke-width="1"/>
  <rect x="18" y="13.5" width="3" height="2" fill="#451a03"/>
  <rect x="27" y="13.5" width="3" height="2" fill="#451a03"/>
  <rect x="19" y="14" width="1" height="1" fill="#fef08a"/>
  <rect x="28" y="14" width="1" height="1" fill="#fef08a"/>
  <!-- Peaked Commander Cap (Mũ thuyền trưởng/sĩ quan) -->
  <rect x="14" y="6" width="20" height="6" fill="#18181b"/>
  <rect x="12" y="9.5" width="24" height="3" fill="#09090b"/>
  <!-- Gold Oak Leaves & Crest -->
  <rect x="14" y="9" width="20" height="1.5" fill="#eab308"/>
  <polygon points="24,6 22,8.5 26,8.5" fill="#facc15"/>
</svg>
