<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Ground shadow -->
  <ellipse cx="24" cy="45" rx="11" ry="3" fill="rgba(15,23,42,0.3)" shape-rendering="geometricPrecision"/>
  <!-- Boots -->
  <rect x="16" y="40" width="6" height="5" fill="#1e293b"/>
  <rect x="26" y="40" width="6" height="5" fill="#1e293b"/>
  <!-- Dark Cargo Pants -->
  <rect x="17" y="32" width="5" height="9" fill="#334155"/>
  <rect x="26" y="32" width="5" height="9" fill="#334155"/>
  <rect x="17" y="30" width="14" height="3" fill="#1e293b"/>
  <!-- Streetwear Hoodie Body -->
  <rect x="14" y="20" width="20" height="11" fill="#1e1b4b"/>
  <rect x="16" y="21" width="16" height="9" fill="#2e1065"/>
  <!-- Straps / Strapped Bag -->
  <line x1="16" y1="21" x2="31" y2="30" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Arms & Gloves -->
  <rect x="12" y="22" width="4" height="9" fill="#2e1065"/>
  <rect x="32" y="22" width="4" height="9" fill="#2e1065"/>
  <rect x="12" y="30" width="4" height="3" fill="#0f172a"/>
  <rect x="32" y="30" width="4" height="3" fill="#0f172a"/>
  <!-- Neck / Collar -->
  <rect x="21" y="19" width="6" height="2" fill="#1e1b4b"/>
  <!-- Head Hood Outer -->
  <rect x="13" y="6" width="22" height="15" rx="3" fill="#1e1b4b"/>
  <!-- Hood Inner Shadow -->
  <rect x="15" y="8" width="18" height="12" fill="#09090b"/>
  <!-- Face (Partially visible under hood) -->
  <rect x="17" y="10" width="14" height="7" fill="#fed7aa"/>
  <!-- Dark Facemask -->
  <rect x="16" y="14" width="16" height="6" fill="#1e293b"/>
  <!-- Shifty Eyes -->
  <rect x="18" y="11" width="4" height="2.5" fill="#e11d48"/>
  <rect x="26" y="11" width="4" height="2.5" fill="#e11d48"/>
  <rect x="19" y="11.5" width="1.5" height="1.5" fill="#ffffff"/>
  <rect x="27" y="11.5" width="1.5" height="1.5" fill="#ffffff"/>
</svg>
