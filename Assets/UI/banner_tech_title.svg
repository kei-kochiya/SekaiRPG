<svg xmlns="http://www.w3.org/2000/svg" width="400" height="80" viewBox="0 0 400 80">
  <defs>
    <linearGradient id="b_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b111a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="b_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2fe4e8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2fe4e8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#9945ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9945ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Main shape with cut corners -->
  <polygon points="16,4 384,4 396,16 396,64 384,76 16,76 4,64 4,16" fill="url(#b_bg)" stroke="#2b3d54" stroke-width="2"/>
  
  <!-- Glowing bottom accent line -->
  <line x1="20" y1="74" x2="380" y2="74" stroke="url(#b_accent)" stroke-width="3"/>
  <line x1="60" y1="6" x2="340" y2="6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
</svg>
