<svg xmlns="http://www.w3.org/2000/svg" width="120" height="44" viewBox="0 0 120 44">
  <defs>
    <linearGradient id="btn_bg_brown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34231b"/>
      <stop offset="100%" stop-color="#1f140f"/>
    </linearGradient>
    <linearGradient id="stroke_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b168"/>
      <stop offset="100%" stop-color="#946533"/>
    </linearGradient>
  </defs>
  <!-- Sharp angular chamfered button -->
  <polygon points="5,1 115,1 119,5 119,39 115,43 5,43 1,39 1,5" fill="url(#btn_bg_brown)" stroke="url(#stroke_gold)" stroke-width="2"/>
  <!-- Top inner highlight line -->
  <line x1="8" y1="4" x2="112" y2="4" stroke="#ffd9a6" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Subtle corner tech notches -->
  <line x1="1" y1="12" x2="1" y2="32" stroke="#e8b168" stroke-width="2"/>
  <line x1="119" y1="12" x2="119" y2="32" stroke="#e8b168" stroke-width="2"/>
</svg>
