<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="18" ry="4" fill="rgba(15,23,42,0.3)" shape-rendering="geometricPrecision"/>
  
  <!-- Base Chest Outline/Dark Body -->
  <rect x="8" y="18" width="32" height="22" fill="#451a03"/>
  <rect x="10" y="20" width="28" height="18" fill="#78350f"/>
  <rect x="12" y="22" width="24" height="14" fill="#92400e"/>
  
  <!-- Horizontal Wood Planks -->
  <line x1="10" y1="28" x2="38" y2="28" stroke="#451a03" stroke-width="1"/>
  <line x1="10" y1="34" x2="38" y2="34" stroke="#451a03" stroke-width="1"/>
  
  <!-- Lid (Domed Top) -->
  <rect x="8" y="12" width="32" height="9" fill="#451a03"/>
  <rect x="10" y="10" width="28" height="3" fill="#451a03"/>
  <rect x="10" y="13" width="28" height="6" fill="#b45309"/>
  <rect x="12" y="11" width="24" height="3" fill="#d97706"/>
  
  <!-- Gold Straps & Corners (Left, Center, Right) -->
  <rect x="8" y="12" width="4" height="28" fill="#b45309"/>
  <rect x="9" y="13" width="2" height="26" fill="#facc15"/>
  <rect x="36" y="12" width="4" height="28" fill="#b45309"/>
  <rect x="37" y="13" width="2" height="26" fill="#facc15"/>
  
  <!-- Center Latch / Lock -->
  <rect x="21" y="18" width="6" height="10" fill="#713f12"/>
  <rect x="22" y="19" width="4" height="8" fill="#fef08a"/>
  <rect x="23" y="22" width="2" height="3" fill="#1e293b"/>
  
  <!-- Rivets -->
  <rect x="9" y="14" width="2" height="2" fill="#fef08a"/>
  <rect x="37" y="14" width="2" height="2" fill="#fef08a"/>
  <rect x="9" y="36" width="2" height="2" fill="#fef08a"/>
  <rect x="37" y="36" width="2" height="2" fill="#fef08a"/>
</svg>
